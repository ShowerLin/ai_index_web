<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" role="img" aria-labelledby="amazon-anthropic-title amazon-anthropic-desc" style="font-family:Arial,sans-serif;background:#f8fafc"><title id="amazon-anthropic-title">Amazon × Anthropic · circular financing</title><desc id="amazon-anthropic-desc">As of 5 October 2026. Amazon / AWS to Anthropic: $18B cumulative investment paid; Paid through 30 Jun 2026. Anthropic to Amazon / AWS: &gt;$100B incremental AWS contract · 10 years; 20 Apr 2026 · delivery milestones apply. Amazon / AWS to Anthropic: $15B remaining contingent facility; As of 30 Jun 2026</desc><defs><marker id="amazon-anthropic-paid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7045b6"/></marker><marker id="amazon-anthropic-commitment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7045b6"/></marker><marker id="amazon-anthropic-purchase" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#176ca4"/></marker><marker id="amazon-anthropic-guarantee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a16a0a"/></marker><marker id="amazon-anthropic-incentive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa4280"/></marker></defs><path d="M 215 230 C 215 45 845 45 845 230" fill="none" stroke="#7045b6" stroke-width="3"  marker-end="url(#amazon-anthropic-paid)"/><text x="530" y="125" text-anchor="middle" font-size="18" fill="#7045b6">$18B cumulative investment paid</text><text x="530" y="158" text-anchor="middle" font-size="14" fill="#536a7c">Paid through 30 Jun 2026</text><path d="M 845 340 C 845 545 215 545 215 340" fill="none" stroke="#176ca4" stroke-width="3"  marker-end="url(#amazon-anthropic-purchase)"/><text x="530" y="430" text-anchor="middle" font-size="18" fill="#176ca4">&gt;$100B incremental AWS contract · 10 years</text><text x="530" y="463" text-anchor="middle" font-size="14" fill="#536a7c">20 Apr 2026 · delivery milestones apply</text><text x="530" y="535" text-anchor="middle" font-size="15" fill="#7045b6">Also: $15B remaining contingent facility · As of 30 Jun 2026</text><rect x="80" y="240" width="270" height="100" rx="16" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><text x="215" y="285" text-anchor="middle" font-size="22" fill="#172d40">Amazon / AWS</text><text x="215" y="319" text-anchor="middle" font-size="14" fill="#536a7c">Supplier / financier</text><rect x="710" y="240" width="270" height="100" rx="16" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><text x="845" y="285" text-anchor="middle" font-size="22" fill="#172d40">Anthropic</text><text x="845" y="319" text-anchor="middle" font-size="14" fill="#536a7c">Customer / recipient</text><text x="530" y="575" text-anchor="middle" font-size="14" fill="#536a7c">Research cutoff: 5 Oct 2026 · arrows show financing / commercial direction</text></svg>