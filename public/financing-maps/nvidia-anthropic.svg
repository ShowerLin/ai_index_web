<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" role="img" aria-labelledby="nvidia-anthropic-title nvidia-anthropic-desc" style="font-family:Arial,sans-serif;background:#f8fafc"><title id="nvidia-anthropic-title">NVIDIA → Anthropic → Microsoft Azure · circular financing</title><desc id="nvidia-anthropic-desc">As of 25 November 2026. NVIDIA to Anthropic: $10B NVIDIA private placement; 20 Nov 2026 · closed alongside IPO. Anthropic to Microsoft Azure: $47.2B–$49.2B · Azure compute; Nov 2026–Jun 2033 · amended agreement. Microsoft Azure to NVIDIA: NVIDIA systems · $ undisclosed; Future deployments · timing undisclosed. Microsoft Azure to Anthropic: $1B Microsoft private placement; 20 Nov 2026 · closed alongside IPO</desc><defs><marker id="nvidia-anthropic-paid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7045b6"/></marker><marker id="nvidia-anthropic-commitment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7045b6"/></marker><marker id="nvidia-anthropic-purchase" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#176ca4"/></marker><marker id="nvidia-anthropic-guarantee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a16a0a"/></marker><marker id="nvidia-anthropic-incentive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#aa4280"/></marker></defs><path d="M 330 145 L 720 145" fill="none" stroke="#7045b6" stroke-width="3"  marker-end="url(#nvidia-anthropic-paid)"/><text x="525" y="60" text-anchor="middle" font-size="18" fill="#7045b6">$10B NVIDIA private placement</text><text x="525" y="93" text-anchor="middle" font-size="14" fill="#536a7c">20 Nov 2026 · closed alongside IPO</text><path d="M 865 200 Q 865 420 675 480" fill="none" stroke="#176ca4" stroke-width="3"  marker-end="url(#nvidia-anthropic-purchase)"/><text x="700" y="295" text-anchor="middle" font-size="18" fill="#176ca4">$47.2B–$49.2B · Azure</text><text x="700" y="320" text-anchor="middle" font-size="18" fill="#176ca4">compute</text><text x="700" y="353" text-anchor="middle" font-size="14" fill="#536a7c">Nov 2026–Jun 2033 · amended</text><text x="700" y="374" text-anchor="middle" font-size="14" fill="#536a7c">agreement</text><path d="M 385 480 Q 195 420 195 200" fill="none" stroke="#176ca4" stroke-width="3"  marker-end="url(#nvidia-anthropic-purchase)"/><text x="360" y="295" text-anchor="middle" font-size="18" fill="#176ca4">NVIDIA systems · $</text><text x="360" y="320" text-anchor="middle" font-size="18" fill="#176ca4">undisclosed</text><text x="360" y="353" text-anchor="middle" font-size="14" fill="#536a7c">Future deployments · timing</text><text x="360" y="374" text-anchor="middle" font-size="14" fill="#536a7c">undisclosed</text><text x="530" y="535" text-anchor="middle" font-size="15" fill="#7045b6">Also: $1B Microsoft private placement · 20 Nov 2026 · closed alongside IPO</text><rect x="60" y="100" width="270" height="100" rx="16" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><text x="195" y="145" text-anchor="middle" font-size="22" fill="#172d40">NVIDIA</text><text x="195" y="179" text-anchor="middle" font-size="14" fill="#536a7c">Supplier / financier</text><rect x="730" y="100" width="270" height="100" rx="16" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><text x="865" y="145" text-anchor="middle" font-size="22" fill="#172d40">Anthropic</text><text x="865" y="179" text-anchor="middle" font-size="14" fill="#536a7c">Customer / recipient</text><rect x="395" y="440" width="270" height="100" rx="16" fill="#fff" stroke="#b8cbd9" stroke-width="2"/><text x="530" y="485" text-anchor="middle" font-size="22" fill="#172d40">Micro